name: Bug report
description: Report a reproducible parser, rule, CLI, or report problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private media, customer text, credentials, and internal paths before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Input format
      options: [SRT, WebVTT, ASS/SSA, JSON, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include a small non-sensitive fixture and the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true

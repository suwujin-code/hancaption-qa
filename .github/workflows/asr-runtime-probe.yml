name: ASR Runtime Probe

on:
  pull_request:
    paths:
      - '.github/workflows/asr-runtime-probe.yml'

permissions:
  contents: read

jobs:
  whisper-runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential ffmpeg python3-pip
          python3 -m pip install --disable-pip-version-check edge-tts

      - name: Build portable whisper.cpp v1.8.6
        run: |
          git clone --depth 1 --branch v1.8.6 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF
          cmake --build whisper.cpp/build --config Release -j2
          whisper.cpp/build/bin/whisper-cli --help | head -40 | tee whisper_help.txt
          ldd whisper.cpp/build/bin/whisper-cli | tee whisper_ldd.txt

      - name: Download and verify multilingual base q5_1
        run: |
          curl -L --fail --retry 3 \
            -o ggml-base-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-base-q5_1.bin
          echo '422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  ggml-base-q5_1.bin' | sha256sum -c -

      - name: Generate natural Mandarin speech probe
        run: |
          printf '%s\n' '水电改造最容易踩坑的并不是价格，真正需要检查的是施工规范。' > expected.txt
          edge-tts \
            --voice zh-CN-XiaoxiaoNeural \
            --rate=-5% \
            --text '水电改造最容易踩坑的并不是价格，真正需要检查的是施工规范。' \
            --write-media probe.mp3
          ffmpeg -hide_banner -loglevel error -y -i probe.mp3 -ar 16000 -ac 1 -c:a pcm_s16le probe.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 probe.wav | tee audio_probe.txt

      - name: Run real Whisper transcription
        run: |
          set -o pipefail
          whisper.cpp/build/bin/whisper-cli \
            -m ggml-base-q5_1.bin \
            -f probe.wav \
            -l zh \
            -otxt -oj \
            -of whisper_probe \
            2>&1 | tee whisper_runtime.log
          test -s whisper_probe.txt
          test -s whisper_probe.json

      - name: Enforce semantic ASR quality gate
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          expected = pathlib.Path('expected.txt').read_text(encoding='utf-8').strip()
          actual = pathlib.Path('whisper_probe.txt').read_text(encoding='utf-8').strip()
          compact = re.sub(r'[\s，。！？、,.!?;；:：]', '', actual)
          groups = {
              'water_electric': ['水电', '水電'],
              'price': ['价格', '價格'],
              'construction': ['施工'],
          }
          hits = {k: any(v in compact for v in variants) for k, variants in groups.items()}
          hit_count = sum(hits.values())
          quality_pass = bool(actual) and hit_count >= 2 and len(compact) >= 10
          model = pathlib.Path('ggml-base-q5_1.bin')
          receipt = {
              'gate': 'ASR_REMOTE_WHISPER_RUNTIME',
              'status': 'PASS' if quality_pass else 'FAIL',
              'whisper_cpp': 'v1.8.6',
              'build_mode': 'portable_x86_64_ggml_native_off',
              'model': 'ggml-base-q5_1.bin',
              'model_sha256': hashlib.sha256(model.read_bytes()).hexdigest(),
              'language': 'zh',
              'tts': 'edge-tts zh-CN-XiaoxiaoNeural',
              'expected_probe': expected,
              'actual_transcript': actual,
              'keyword_hits': hits,
              'keyword_hit_count': hit_count,
              'quality_rule': 'non-empty + >=2/3 semantic keyword groups + >=10 compact characters',
              'truth_boundary': 'Synthetic natural-Mandarin probe; validates real Whisper runtime/provider quality path, not final raw-talking-head editorial quality.'
          }
          pathlib.Path('asr_runtime_receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          if not quality_pass:
              raise SystemExit(2)
          PY

      - name: Package portable sandbox runtime
        if: success()
        run: |
          mkdir -p runtime_bundle/bin runtime_bundle/models
          cp whisper.cpp/build/bin/whisper-cli runtime_bundle/bin/whisper-cli
          cp ggml-base-q5_1.bin runtime_bundle/models/ggml-base-q5_1.bin
          chmod +x runtime_bundle/bin/whisper-cli
          sha256sum runtime_bundle/bin/whisper-cli runtime_bundle/models/ggml-base-q5_1.bin | tee runtime_bundle/SHA256SUMS.txt
          cp whisper_ldd.txt runtime_bundle/whisper_ldd.txt
          cat > runtime_bundle/RUNTIME_MANIFEST.json <<'JSON'
          {
            "schema": "oing.asr-runtime-bundle/v2",
            "platform": "linux-x86_64",
            "whisper_cpp": "v1.8.6",
            "build_shared_libs": false,
            "ggml_native": false,
            "compatibility_target": "portable x86-64; no -march=native / runner-specific AMX",
            "model": "ggml-base-q5_1.bin",
            "model_sha256": "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898",
            "purpose": "Portable sandbox/runtime bootstrap for OING Short-form Editor Brain ASR gate"
          }
          JSON
          tar -czf whisper_runtime_linux_x64_portable.tar.gz runtime_bundle
          sha256sum whisper_runtime_linux_x64_portable.tar.gz | tee whisper_runtime_linux_x64_portable.tar.gz.sha256

      - name: Upload ASR proof and portable runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortform-editor-asr-runtime-proof-v4-portable
          compression-level: 0
          path: |
            asr_runtime_receipt.json
            expected.txt
            whisper_probe.txt
            whisper_probe.json
            whisper_runtime.log
            audio_probe.txt
            whisper_help.txt
            whisper_ldd.txt
            whisper_runtime_linux_x64_portable.tar.gz
            whisper_runtime_linux_x64_portable.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 3

name: Decode H3 direct reference assets
on:
  push:
    branches: [h3-ref-assets-20260911]
    paths:
      - 'h3-assets-20260911/direct/*.b64'
      - '.github/workflows/decode-h3-assets-direct.yml'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h3-ref-assets-20260911
          fetch-depth: 0
      - name: Decode direct reference images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h3-assets-20260911/public
          for src in h3-assets-20260911/direct/*.webp.b64; do
            name=$(basename "$src" .b64)
            base64 -d "$src" > "h3-assets-20260911/public/$name"
          done
          file h3-assets-20260911/public/*
          ls -lh h3-assets-20260911/public
      - name: Commit decoded images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h3-assets-20260911/public
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Decode direct H3 reference assets [skip ci]'
            git push origin HEAD:h3-ref-assets-20260911
          fi
